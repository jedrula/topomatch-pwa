<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Push Notification Integration Test</title>
  <style>
    body {
      font-family: monospace;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    h1 { color: #4ec9b0; }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #3c3c3c;
      border-radius: 5px;
      background: #252526;
    }
    .test-name {
      font-weight: bold;
      color: #dcdcaa;
      margin-bottom: 10px;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 3px;
      margin-right: 10px;
      font-weight: bold;
    }
    .status.pending { background: #3a3a3a; color: #999; }
    .status.running { background: #1e3a5f; color: #4fc3f7; }
    .status.success { background: #1e4620; color: #4caf50; }
    .status.error { background: #5f1e1e; color: #f44336; }
    .result {
      margin-top: 10px;
      padding: 10px;
      background: #1e1e1e;
      border-left: 3px solid #3c3c3c;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .result.success { border-left-color: #4caf50; }
    .result.error { border-left-color: #f44336; }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 14px;
      margin: 10px 5px 10px 0;
    }
    button:hover { background: #1177bb; }
    button:disabled {
      background: #3a3a3a;
      cursor: not-allowed;
    }
    .info {
      background: #2d2d30;
      padding: 10px;
      margin: 20px 0;
      border-left: 3px solid #4ec9b0;
    }
  </style>
</head>
<body>
  <h1>🔔 Push Notification Integration Test</h1>
  
  <div class="info">
    <strong>Instructions:</strong><br>
    1. Make sure you're logged in to the app<br>
    2. Click "Run All Tests" to diagnose the push notification setup<br>
    3. Check which step fails to identify the issue
  </div>

  <button onclick="runAllTests()">Run All Tests</button>
  <button onclick="clearResults()">Clear Results</button>

  <div id="test-results"></div>

  <script type="module">
    // Firebase config (production credentials)
    const firebaseConfig = {
      apiKey: 'AIzaSyD2LND6HuSMwEFL70ke48mJczTP5uScMW0',
      authDomain: 'topomatch-pwa.firebaseapp.com',
      projectId: 'topomatch-pwa',
      storageBucket: 'topomatch-pwa.firebasestorage.app',
      messagingSenderId: '592023645230',
      appId: '1:592023645230:web:0de421f7ba777652ef43bf',
    };

    const VAPID_KEY = 'BLPGAEdXNWdKPJbEd6FEBlIXkOE5neVKGZl1ixMcyKSxGt7-ulTfRBd2qibyNaYI2p2OIVdomaFPOrRFrsUV4xI';

    // Import Firebase modules
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, collection, getDocs, connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js';
    import { getMessaging, getToken } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-messaging.js';
    import { getFunctions, httpsCallable, connectFunctionsEmulator } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-functions.js';

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const messaging = getMessaging(app);
    const functions = getFunctions(app);

    // Connect to emulators
    connectFirestoreEmulator(db, 'localhost', 8080);
    connectFunctionsEmulator(functions, 'localhost', 5001);

    // Test state
    let currentUser = null;
    let testResults = [];

    // Listen for auth state
    onAuthStateChanged(auth, (user) => {
      currentUser = user;
    });

    // Test runner
    window.runAllTests = async function() {
      testResults = [];
      document.getElementById('test-results').innerHTML = '';
      
      const tests = [
        { name: 'Check User Authentication', fn: testAuth },
        { name: 'Check Service Worker Registration', fn: testServiceWorker },
        { name: 'Check Notification Permission', fn: testNotificationPermission },
        { name: 'Check FCM Token Generation', fn: testFCMToken },
        { name: 'Check Firestore Token Storage', fn: testFirestoreTokenStorage },
        { name: 'Check Function Callable', fn: testFunctionCallable },
      ];

      for (const test of tests) {
        await runTest(test.name, test.fn);
      }
    };

    window.clearResults = function() {
      testResults = [];
      document.getElementById('test-results').innerHTML = '';
    };

    async function runTest(name, testFn) {
      const testEl = createTestElement(name);
      document.getElementById('test-results').appendChild(testEl);
      
      updateTestStatus(testEl, 'running');
      
      try {
        const result = await testFn();
        updateTestStatus(testEl, 'success', result);
        testResults.push({ name, status: 'success', result });
      } catch (error) {
        updateTestStatus(testEl, 'error', error.message);
        testResults.push({ name, status: 'error', error: error.message });
      }
    }

    function createTestElement(name) {
      const div = document.createElement('div');
      div.className = 'test-section';
      div.innerHTML = `
        <div class="test-name">${name}</div>
        <div class="test-status">
          <span class="status pending">PENDING</span>
        </div>
        <div class="result" style="display:none;"></div>
      `;
      return div;
    }

    function updateTestStatus(testEl, status, message = '') {
      const statusEl = testEl.querySelector('.status');
      const resultEl = testEl.querySelector('.result');
      
      statusEl.className = `status ${status}`;
      statusEl.textContent = status.toUpperCase();
      
      if (message) {
        resultEl.style.display = 'block';
        resultEl.className = `result ${status}`;
        resultEl.textContent = typeof message === 'object' ? JSON.stringify(message, null, 2) : message;
      }
    }

    // Test functions
    async function testAuth() {
      if (!currentUser) {
        throw new Error('Not logged in. Please log in to the app first.');
      }
      return `✓ Logged in as: ${currentUser.email || currentUser.uid}`;
    }

    async function testServiceWorker() {
      if (!('serviceWorker' in navigator)) {
        throw new Error('Service Worker not supported in this browser');
      }

      const registrations = await navigator.serviceWorker.getRegistrations();
      const swReg = registrations.find(reg => 
        reg.active?.scriptURL.includes('firebase-messaging-sw.js')
      );

      if (!swReg) {
        throw new Error('firebase-messaging-sw.js not registered. Check if service worker file exists in public/');
      }

      return `✓ Service worker registered at: ${swReg.active.scriptURL}\n✓ State: ${swReg.active.state}`;
    }

    async function testNotificationPermission() {
      const permission = Notification.permission;
      
      if (permission === 'denied') {
        throw new Error('Notification permission DENIED. Reset in browser settings: Chrome > Settings > Privacy > Site Settings > Notifications > localhost');
      }

      if (permission === 'default') {
        throw new Error('Notification permission not requested yet. The app should request it on login.');
      }

      return `✓ Notification permission: ${permission}`;
    }

    async function testFCMToken() {
      try {
        const token = await getToken(messaging, { vapidKey: VAPID_KEY });
        
        if (!token) {
          throw new Error('Failed to get FCM token. Check browser console for errors.');
        }

        // Check token prefix (should be consistent for same browser)
        const prefix = token.split(':')[0];
        return `✓ FCM token generated successfully\n✓ Token prefix: ${prefix}\n✓ Full token: ${token.substring(0, 50)}...`;
      } catch (error) {
        throw new Error(`FCM token generation failed: ${error.message}\n\nPossible causes:\n- Service worker not properly initialized\n- VAPID key mismatch\n- Firebase config incorrect`);
      }
    }

    async function testFirestoreTokenStorage() {
      if (!currentUser) {
        throw new Error('Cannot test Firestore without authentication');
      }

      const token = await getToken(messaging, { vapidKey: VAPID_KEY });
      const userId = currentUser.uid;

      // Try to save token
      const tokenRef = doc(db, 'users', userId, 'fcmTokens', token);
      await setDoc(tokenRef, {
        token,
        createdAt: new Date(),
        lastUsed: new Date(),
        testTimestamp: Date.now(),
      }, { merge: true });

      // Read back
      const tokensSnapshot = await getDocs(collection(db, 'users', userId, 'fcmTokens'));
      const tokens = tokensSnapshot.docs.map(d => ({
        id: d.id,
        prefix: d.id.split(':')[0],
        ...d.data()
      }));

      return `✓ Token saved to Firestore\n✓ Total tokens for user: ${tokens.length}\n✓ Token prefixes: ${tokens.map(t => t.prefix).join(', ')}\n\nTokens:\n${JSON.stringify(tokens, null, 2)}`;
    }

    async function testFunctionCallable() {
      if (!currentUser) {
        throw new Error('Cannot test function without authentication');
      }

      try {
        // Try calling the notification function
        const notifyNewRoutesetting = httpsCallable(functions, 'notifyNewRoutesetting');
        const result = await notifyNewRoutesetting({
          locationId: 'test-location',
          locationName: 'Test Location',
        });

        return `✓ Function callable\n✓ Response: ${JSON.stringify(result.data, null, 2)}`;
      } catch (error) {
        if (error.code === 'permission-denied') {
          return `⚠️ Function callable but permission denied (expected if not admin)\n✓ This is OK for testing - function exists and responds`;
        }
        throw error;
      }
    }

    // Expose for debugging
    window.testUtils = {
      getAuth: () => auth,
      getDb: () => db,
      getMessaging: () => messaging,
      getCurrentUser: () => currentUser,
      getTestResults: () => testResults,
    };

    console.log('Test page loaded. Use runAllTests() to start testing.');
    console.log('Debug tools available at window.testUtils');
  </script>
</body>
</html>
