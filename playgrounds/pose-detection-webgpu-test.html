<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Pose Detection Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 24px;
        }
        .status {
            padding: 12px;
            margin: 12px 0;
            border-radius: 8px;
            font-weight: 500;
        }
        .status.info { background: #e3f2fd; color: #1976d2; }
        .status.success { background: #e8f5e9; color: #388e3c; }
        .status.error { background: #ffebee; color: #d32f2f; }
        .status.warning { background: #fff3e0; color: #f57c00; }
        .controls {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #3b82f6;
            color: white;
            transition: all 0.2s;
        }
        button:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
        }
        #imageContainer {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        canvas {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            max-width: 100%;
        }
        .timing {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 12px;
            color: #6b7280;
            margin-top: 8px;
        }
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 WebGPU Pose Detection Test</h1>
        
        <div id="status" class="status info">
            Initializing WebGPU worker...
        </div>

        <div class="controls">
            <button id="testBtn" onclick="runTest()" disabled>Run Test</button>
            <button id="warmupBtn" onclick="runWarmup()" disabled>Warmup GPU</button>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <button onclick="document.getElementById('fileInput').click()" disabled id="uploadBtn">Upload Image</button>
        </div>

        <div id="imageContainer"></div>

        <div id="timings" style="margin-top: 20px;"></div>

        <h3>Console Output:</h3>
        <pre id="console"></pre>
    </div>

    <script type="module">
        let poseWorker;
        let sessionReady = false;
        let currentImage = null;
        const consoleOutput = [];

        // Intercept console.log
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : a).join(' ');
            consoleOutput.push(message);
            document.getElementById('console').textContent = consoleOutput.slice(-30).join('\n');
        };

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            console.log(`[Status] ${message}`);
        }

        async function initWorker() {
            try {
                updateStatus('Creating WebGPU module worker...', 'info');
                
                // ✨ CRITICAL: Use type: 'module' for ES module worker
                poseWorker = new Worker('../src/workers/poseDetectionWorkerWebGPU.js', { type: 'module' });

                poseWorker.onmessage = (e) => {
                    console.log('[Main] Worker message:', e.data.type);

                    if (e.data.type === 'ready') {
                        updateStatus('Worker ready, creating WebGPU session...', 'info');
                        poseWorker.postMessage({ type: 'createSession' });
                    }

                    if (e.data.type === 'sessionCreated') {
                        sessionReady = true;
                        updateStatus(`✅ WebGPU session ready! (${e.data.duration.toFixed(0)}ms)`, 'success');
                        document.getElementById('testBtn').disabled = false;
                        document.getElementById('warmupBtn').disabled = false;
                        document.getElementById('uploadBtn').disabled = false;
                    }

                    if (e.data.type === 'detectionComplete') {
                        const { poses, inferenceTime, yoloTime, nmsTime } = e.data;
                        updateStatus(`✅ Found ${poses.length} pose(s) in ${inferenceTime.toFixed(0)}ms`, 'success');
                        
                        const timings = document.getElementById('timings');
                        timings.innerHTML = `
                            <div class="timing">
                                <strong>Performance:</strong><br>
                                YOLO: ${yoloTime.toFixed(0)}ms | NMS: ${nmsTime.toFixed(0)}ms | Total: ${inferenceTime.toFixed(0)}ms<br>
                                Poses detected: ${poses.length}
                            </div>
                        `;

                        if (currentImage) {
                            drawPoses(currentImage, poses);
                        }
                    }

                    if (e.data.type === 'error') {
                        updateStatus(`❌ Error: ${e.data.error}`, 'error');
                    }
                };

                poseWorker.onerror = (error) => {
                    updateStatus(`❌ Worker error: ${error.message}`, 'error');
                    console.error('[Main] Worker error:', error);
                };

            } catch (error) {
                updateStatus(`❌ Failed to create worker: ${error.message}`, 'error');
                console.error('[Main] Init error:', error);
            }
        }

        async function runWarmup() {
            if (!sessionReady) {
                updateStatus('⏳ Session not ready yet', 'warning');
                return;
            }

            updateStatus('🔥 Warming up GPU (shader compilation)...', 'info');
            
            // Create dummy image
            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 640;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, 640, 640);
            const imageData = ctx.getImageData(0, 0, 640, 640);

            poseWorker.postMessage({
                type: 'runPoseDetection',
                imageData: imageData
            });
        }

        async function runTest() {
            if (!sessionReady) {
                updateStatus('⏳ Session not ready yet', 'warning');
                return;
            }

            updateStatus('📸 Loading test image...', 'info');

            // Load test image
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = async () => {
                currentImage = img;
                
                // Convert to ImageData
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, img.width, img.height);

                updateStatus('🚀 Running WebGPU inference...', 'info');
                
                poseWorker.postMessage({
                    type: 'runPoseDetection',
                    imageData: imageData
                });
            };
            
            img.onerror = () => {
                updateStatus('❌ Failed to load test image', 'error');
            };
            
            // Use a test image
            img.src = 'https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?w=800';
        }

        // Handle file upload
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, img.width, img.height);

                    updateStatus('🚀 Running WebGPU inference on uploaded image...', 'info');
                    
                    poseWorker.postMessage({
                        type: 'runPoseDetection',
                        imageData: imageData
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function drawPoses(image, poses) {
            const container = document.getElementById('imageContainer');
            container.innerHTML = '';

            const canvas = document.createElement('canvas');
            canvas.width = image.width;
            canvas.height = image.height;
            const ctx = canvas.getContext('2d');

            // Draw image
            ctx.drawImage(image, 0, 0);

            // Draw poses
            poses.forEach((pose, index) => {
                // Draw skeleton connections
                const connections = [
                    [0, 1], [0, 2], [1, 3], [2, 4], // Head
                    [5, 6], [5, 7], [7, 9], [6, 8], [8, 10], // Arms
                    [5, 11], [6, 12], [11, 12], // Torso
                    [11, 13], [13, 15], [12, 14], [14, 16] // Legs
                ];

                ctx.strokeStyle = `hsl(${index * 137.5}, 70%, 50%)`;
                ctx.lineWidth = 3;

                connections.forEach(([i, j]) => {
                    const kp1 = pose.keypoints[i];
                    const kp2 = pose.keypoints[j];
                    if (kp1.confidence > 0.3 && kp2.confidence > 0.3) {
                        ctx.beginPath();
                        ctx.moveTo(kp1.x, kp1.y);
                        ctx.lineTo(kp2.x, kp2.y);
                        ctx.stroke();
                    }
                });

                // Draw keypoints
                pose.keypoints.forEach((kp) => {
                    if (kp.confidence > 0.3) {
                        ctx.fillStyle = `hsl(${index * 137.5}, 70%, 50%)`;
                        ctx.beginPath();
                        ctx.arc(kp.x, kp.y, 5, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
            });

            container.appendChild(canvas);
        }

        // Initialize on load
        window.addEventListener('load', initWorker);
        window.runTest = runTest;
        window.runWarmup = runWarmup;
    </script>
</body>
</html>
